 reg 35 0
 reg 36 0
 reg 37 0

#-------------------------------------------------------------------------------------------#
# CPU/DDR PLL
# CPU 400MHz, DDR 200MHz, AHB 200MHz with oscillator 25MHz and VCO frequency 800MHz

 # Clear WLAN rest bit in Reset Register 0x1C
 mww 0xB806001C 0x00C06B30
 mww 0xB806001C 0x00C06330

 # Check BOOTSTRAP register
 mww 0xB80600AC 0x0002110E

 # RTC Reset
 mww 0xB810704C 0x00000003
 mww 0xB8107040 0x00000000
 mww 0xB8107040 0x00000001

 # Set BYPASS, CPU_POST_DIV, DDR_POST_DIV, AHB_POST_DIV in CPU Clock Control Register
 mww 0xB8050008 0x00008404

 # Set SETTLE_TIME in CPU PLL Configuration Register2
 mww 0xB8050004 0x00000352

 # Set PLL power down bit in CPU PLL Configuration Register
 mww 0xB8050000 0x40815000

 # nint, nfrac, refdiv, outdiv, range in CPU PLL Configuration Register
 mww 0xB8050000 0x40818000
                                # nfrac  0x0  for oscillator 25MHz, 0x0  for oscillator 40MHz
                                # refdiv 0x1  for oscillator 25MHz, 0x1  for oscillator 40MHz
                                # outdiv 0x1  for oscillator 25MHz, 0x1  for oscillator 40MHz
                                # range  0x0  for VCO frequency 530 - 830MHz, 0x1  for VCO frequency 350 - 750MHz

 # NFRAC_MIN (Bit 19:10) : 0x0 for oscillator 25MHz, 0x0 for oscillator 40MHz
 mww 0xB8050010 0x001003E8

 # Clear PLL power down bit in CPU PLL Configuration Register
 mww 0xB8050000 0x00818000

 # Set Asynchronous Mode
 # Hornet is in Asynchronous Mode by default# uboot may change it to Synchronous Mode before ICE is attached
 # Synchronous Mode can be used only when CPU and DDR run at the same clock rate
 mww 0xB8000028 0x00010005

 # Clear BYPASS in CPU Clock Control Register
 mww 0xB8050008 0x00008400

#--------DDR_Config_1--------
#CAS_LAT_MSB[31]-OPEN[30]-CAS_LAT[29:27]-TMRD[26:23]-TRFC[22:17]-TRRD[16:13]-TRP[12:9]-TRCD[8:5]-TRAS[4:0]#

 #mww 0xB8000000 0x7fbc8cd0     #  // CAS latency inside the controller is set to 3.5 (CAS_LAT[31,29:27] set to 7)
#mww 0xB8000000 0x77bc8cd0     #  // CAS latency inside the controller is set to 3 (CAS_LAT[31,29:27] set to 6)

#   0xcfbc8cd0   # Cas Latency 9
#   0xc7bc8cd0   # Cas Latency 8
#   0x7fbc8cd0   # Cas Latency 7
#   0x77bc8cd0   # Cas Latency 6
#   0x6fbc8cd0   # Cas Latency 5
#   0x67bc8cd0   # Cas Latency 4
#   0x5fbc8cd0   # Cas Latency 3
#   0x57bc8cd0   # Cas Latency 2
#   0x4fbc8cd0   # Cas Latency 1

#--------DDR_Config_2--------
#HLF_WDT_LOW[31]-x-GATE_OPEN_LATENCY[29:26]-TWTR[25:21]-TRTP[20:17]-TRTW[16:12]-TWR[11:8]-CKE[7]-PHASE_SEL[6]-CNTL_OE[5]-BURST_TYPE[4]-BURST_LEN[3:0]#

#mww 0xB8000004 0x99d0e6a8     #  // GATEOPEN set to 6 (CAS Latency set in DDR x 2)
 mww 0xB8000004 0x9dd0e6a8

#   0xadd0e6a8   # Gate Open 11
#   0xa9d0e6a8   # Gate Open 10
#   0xa5d0e6a8   # Gate Open 9
#   0xa1d0e6a8   # Gate Open 8
#   0x9dd0e6a8   # Gate Open 7
#   0x99d0e6a8   # Gate Open 6
#   0x95d0e6a8   # Gate Open 5
#   0x91d0e6a8   # Gate Open 4
#   0x8dd0e6a8   # Gate Open 3
#   0x89d0e6a8   # Gate Open 2

#------------------------------------------------------------------------------------------#
# DDR1 Paramters

 mww 0xB8000010 0x8

 mww 0xB8000008 0x133
 mww 0xB8000010 0x1

 mww 0xB800000C 0x2
 mww 0xB8000010 0x2

 mww 0xB8000010 0x8
 mww 0xB8000008 0x33
 mww 0xB8000010 0x1

 mww 0xB8000014 0x4f10

 # Use ctest "ddr_tap"
 # 0xB800001C : stored in 0x80500008
 # 0xB8000020 : stored in 0x8050000c
 mww 0xB800001C 0x0f
 mww 0xB8000020 0x10

 mww 0xB8000018 0x00ff
}
