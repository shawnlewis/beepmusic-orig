proc load_flasher { } {
    #load_image ../../build/beeptwo/libflashlib.a 0x80001000 bin
    load_image ../../build/beeptwo/libflashlib.a 0xa0000000 bin
}

proc flash_id { } {
    # zero some stack space so we can see what happens
    mww 0xa0f00000 0 100

    # stack grows downward
    reg sp 0xa0f00100

    # run ath_spi_read_id function
    reg pc 0xa0000000
    resume

    sleep 1000
    halt

    reg pc

    mdw 0xa0f00000 100
}

proc init_pll { } {
    mww 0xb8050008 0x00018004
    mww 0xb8050004 0x00000352
    mww 0xb8050000 0x40818000
    mww 0xb8050010 0x001003e8
    mww 0xb8050000 0x00818000
    mww 0xb8050008 0x00008000
}

proc init_spi { } {
    mww 0xbf000000 0x00000001
    mww 0xbf000004 0x00000044
    mww 0xbf000000 0x00000000
    mww 0xb8040028 0x00040000
    mww 0xb8040000 0x00000cff
    mww 0xb8040008 0x00004000
}

proc init_ddr2 { } {
    mww 0xb8000000 0x7fbc8cd0
    mww 0xb8000004 0x99d0e6a8

    mww 0xb800008c 0xa59
    mww 0xb8000010 0x8
    mww 0xb8000090 0x0
    mww 0xb8000010 0x10
    mww 0xb8000094 0x0
    mww 0xb8000010 0x20
    mww 0xb800000c 0x0
    mww 0xb8000010 0x2
    mww 0xb8000008 0x100
    mww 0xb8000010 0x1
    mww 0xb8000010 0x8
    mww 0xb8000010 0x4
    mww 0xb8000010 0x4

    mww 0xb8000008 0xa33
    mww 0xb8000010 0x1
    mww 0xb800000c 0x382
    mww 0xb8000010 0x2
    mww 0xb800000c 0x402
    mww 0xb8000010 0x2
    mww 0xb8000014 0x4270
    mww 0xb800001c 0x8
    mww 0xb8000020 0x9
    mww 0xb8000018 0xff
}

# Should do in a init program.
proc init_stack { } {
    echo "Setting stack to 0xa0670080"
    mww 0xa0670000 0 80
    reg sp 0xa0670080
}

proc dump_stack { } {
    mdw 0xa0670000 80
}

proc init_cpu { } {
    echo " Resetting cpu..."
    reset
    halt
    echo "Initializing plls..."
    init_pll
    echo "Initializing ddr2..."
    init_ddr2
    echo "Initializing spi..."
    init_spi
    echo "Resetting registers..."
    reset_reg
    init_stack
}

proc load_flash_tools { } {
    load_image ../../out/beeptwo/flash.bin 0xa0640000 bin
}

proc init_flash { } {
    resume 0xa06401f8
}

proc erase_uboot { } {
    halt
    reg 4 0
    resume 0xa0640a84
    sleep 1000
    halt
    reg 4 0x10000
    resume 0xa0640a84
    sleep 1000
    halt
    reg 4 0x20000
    resume 0xa0640a84
    sleep 1000
    halt
    reg 4 0x30000
    resume 0xa0640a84
    sleep 1000
    halt
    reg 4 0x40000
    resume 0xa0640a84
    sleep 1000
    halt
}

proc write_uboot { } {
    load_image uboot.bin 0xa0800000
    reg 4 0xa0800000
    reg 5 0x00000000
    reg 6 0x40000
    resume 0xa0640354
    sleep 7000
    halt
}

proc update_uboot { } {
    erase_uboot
    write_uboot
}

